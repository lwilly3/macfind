[package]
name = "macfind"
version = "0.1.0"
edition = "2021"
description = "Retrouver l'IP d'un équipement à partir de son adresse MAC en interrogeant les routeurs MikroTik (API REST RouterOS v7)"
license = "MIT"
repository = "https://github.com/lwilly3/macfind"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "5"
if-addrs = "0.15.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3" }

[profile.release]
strip = true
lto = true
