name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verifier:
    name: Étiquette = version de Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparer l'étiquette et Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $version de Cargo.toml"
            exit 1
          fi

  binaires:
    name: Binaire ${{ matrix.target }}
    needs: verifier
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Tests
        run: cargo test --locked

      - name: Compilation
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive et somme SHA-256
        run: |
          nom="macfind-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$nom"
          cp "target/${{ matrix.target }}/release/macfind" README.md LICENSE CHANGELOG.md "$nom/"
          tar -czf "$nom.tar.gz" "$nom"
          shasum -a 256 "$nom.tar.gz" > "$nom.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            macfind-*.tar.gz
            macfind-*.tar.gz.sha256
          if-no-files-found: error

  application:
    name: Application ${{ matrix.arch }}
    needs: verifier
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          # Le numéro de build de l'application est le nombre de commits.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: application-${{ matrix.target }}

      - name: Tests de l'interface
        run: swift test --package-path app

      - name: Image disque
        run: scripts/build-app.sh --arch ${{ matrix.arch }} --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.arch }}
          path: |
            dist/macfind-*.dmg
            dist/macfind-*.dmg.sha256
          if-no-files-found: error

  publication:
    name: Release GitHub
    needs: [binaires, application]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes tirées du changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { dedans = 1; next }
            dedans && /^## \[/ { exit }
            dedans && /^\[.*\]: / { exit }
            dedans { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Aucune section [$version] dans CHANGELOG.md"
            exit 1
          fi

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "macfind ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
